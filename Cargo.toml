[package]
name = "bstruct_browser_base"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at 
# https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3.64"

[dependencies.web-sys]
version = "0.3.64"

features = [
    "console",
    "Document",
    "DocumentFragment",
    "Event",
    "HtmlElement",
    "HtmlHeadElement",
    "Location",
    "ShadowRoot",
    "ShadowRootInit",
    "ShadowRootMode",
    "Url",
    "Window",

    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    
    # "CustomElementRegistry",
    # "Element",
    # "HtmlFormElement",
    # "HtmlInputElement",
    # "HtmlSlotElement",
    # "HtmlTemplateElement",
    # "MutationObserver"
    # "Node",
    # "SubmitEvent",
]          

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lib]
# crate-type = ["cdylib"]
crate-type = ["lib"]
