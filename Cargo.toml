[package]
name = "website_base"
version = "0.1.1"
edition = "2024"

# See more keys and their definitions at 
# https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "console",
    "CssStyleDeclaration",
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "DocumentFragment",
    "DomRect",
    "DomTokenList",
    "Element",
    "Event",
    "Headers",
    "HtmlCollection",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlInputElement",
    "HtmlStyleElement",
    "HtmlTextAreaElement",
    "Location",
    "MouseEvent",
    "NodeList",
    "Performance",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "ShadowRoot",
    "ShadowRootInit",
    "ShadowRootMode",
    "StyleSheet",
    "Url",
    "Window",
]}

[dev-dependencies]
wasm-bindgen-test = "0.3"
serde = { version = "1", features = ["derive"] }

[lib]
# crate-type = ["cdylib"]
crate-type = ["lib"]
